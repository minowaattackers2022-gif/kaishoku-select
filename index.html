*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:"Noto Sans JP",sans-serif;background:#FBF8F3;overscroll-behavior:none;max-width:430px;margin:0 auto}
::-webkit-scrollbar{display:none}

@keyframes slideUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
@keyframes sInR  {from{opacity:0;transform:translateX(28px)} to{opacity:1;transform:translateX(0)}}
@keyframes sInL  {from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:translateX(0)}}
@keyframes sOutR {from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(24px)}}
@keyframes sOutL {from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(-24px)}}
@keyframes badgePop{0%{transform:scale(0) rotate(-12deg)}65%{transform:scale(1.12) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
@keyframes lineGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.slide-r{animation:sInR  .3s cubic-bezier(.4,0,.2,1) both}
.slide-l{animation:sInL  .3s cubic-bezier(.4,0,.2,1) both}
.out-r  {animation:sOutR .22s cubic-bezier(.4,0,.2,1) forwards}
.out-l  {animation:sOutL .22s cubic-bezier(.4,0,.2,1) forwards}

.chip{transition:all .13s ease;user-select:none}
.chip:active{transform:scale(.92)}
.purpose-card{transition:all .15s ease}
.purpose-card:active{transform:scale(.96)}

/* RESULT CARDS stagger */
.rcard{animation:slideUp .42s cubic-bezier(.16,1,.3,1) both;border:1px solid #E2D8C8;border-radius:20px;background:#fff;overflow:hidden}
.rcard:nth-child(1){animation-delay:.04s}
.rcard:nth-child(2){animation-delay:.17s}
.rcard:nth-child(3){animation-delay:.30s}

/* RANK BADGES */

.r2{background:linear-gradient(135deg,#5c6670,#BCC4CC,#A8B4BC);color:#0d1214}
.r3{background:linear-gradient(135deg,#7B3F0A,#CD853F,#B87333);color:#fff}

/* SNS BUTTONS */
.tk-btn{background:#000;color:#fff;transition:transform .12s,opacity .12s}
.tk-btn:active{transform:scale(.93);opacity:.8}

/* PROGRESS LINE */
.pgline{transition:background .4s ease}

/* MAPS NAV BUTTON */
.maps-nav-btn{
  background:linear-gradient(135deg,#1a6b3a,#006241);
  color:#fff;
  box-shadow:0 4px 18px rgba(0,98,65,.45);

}
.maps-nav-btn:hover{box-shadow:0 6px 24px rgba(0,98,65,.6)}
.maps-nav-btn:active{transform:scale(.96);box-shadow:0 2px 10px rgba(0,98,65,.35)}

.pref-row{display:flex;align-items:flex-start;gap:0;padding:10px 14px}
.pref-region{font-size:.72rem;font-weight:700;color:#1A1A1A;min-width:64px;padding-top:6px;flex-shrink:0;letter-spacing:-.01em;line-height:1.3}
.pref-list{display:flex;flex-wrap:wrap;gap:1px 0}
.pref-chip{padding:5px 11px;font-size:.8rem;color:#4A4A4A;background:none;border:none;cursor:pointer;border-radius:6px;transition:background .13s,color .13s;font-family:"Noto Sans JP",sans-serif;white-space:nowrap}

.pref-chip:active{transform:scale(.92)}
.pref-chip.selected{background:#006241;color:#fff;font-weight:700;border-radius:6px}

/* GPS BUTTON STATES */
#gps-btn.loading{opacity:.75;pointer-events:none}
#gps-btn.done{border-color:#CBA258;background:linear-gradient(135deg,#1E3932,#0d2b24)}

/* ─────────────────────────────
   SCORING ENGINE
   エリア一致必須・未登録はSNS検索へ
───────────────────────────── */
function scoreStore(s) {
  let sc = 0;
  if (s.purpose.includes(S.purpose)) sc += 10;
  S.conds.forEach(c => { if (s.tags.includes(c)) sc += 5; });
  sc += (s._r = s._r || Math.random() * 3);
  return sc;
}

function getTop3() {
  // エリア一致するお店だけ候補にする
  const area = S.area.replace(/[都道府県]$/, ''); // "東京都" → "東京" で幅広くマッチ
  const candidates = DB.filter(s =>
    s.areas.some(a => a.includes(area) || area.includes(a.replace(/[都道府県]$/,'')))
  );
  // 候補ゼロ = 未登録エリア → null を返してSNS検索モードへ
  if (!candidates.length) return null;
  return candidates
    .map(s => ({...s, sc: scoreStore(s)}))
    .sort((a,b) => b.sc - a.sc)
    .slice(0, 3);
}

function renderTop3() {

    `<span class="px-3 py-1.5 rounded-full text-xs font-bold" style="background:rgba(203,162,88,.2);color:#CBA258">🎯 ${S.purpose}</span>`,

  ].join('');

/* ─────────────────────────────
   NAVIGATION
───────────────────────────── */
function go(next) {
  const from = document.getElementById('step' + cur);
  const to   = document.getElementById('step' + next);
  if (!from || !to) { console.error('step not found', cur, next); return; }

  const fwd = next > cur;

  // ① 現在のステップをアニメーションで退場
  from.style.animation = fwd
    ? 'sOutL .2s cubic-bezier(.4,0,.2,1) forwards'
    : 'sOutR .2s cubic-bezier(.4,0,.2,1) forwards';

  setTimeout(() => {
    // ② 現在のステップを隠す
    from.style.animation = '';
    from.classList.add('hidden');

    // ③ 次のステップに必要なデータを準備（ここで実行すれば確実）
    try {
      if (next === 3) buildConds();
    } catch(e) { console.error('buildConds error:', e); }

    // ④ 次のステップを表示
    to.classList.remove('hidden');
    to.style.animation = fwd
      ? 'sInR .28s cubic-bezier(.4,0,.2,1) both'
      : 'sInL .28s cubic-bezier(.4,0,.2,1) both';

    setTimeout(() => {
      to.style.animation = '';
      if (next === 4) { try { renderTop3(); } catch(e) { console.error('renderTop3 error:', e); } }
    }, 300);

    // ⑤ トップにスクロール（smoothはモバイルでフリーズする場合があるため auto）
    window.scrollTo({ top: 0, behavior: 'auto' });

  }, 190);

  cur = next;
  updPg();
  updHdr();
}

/* ─────────────────────────────
   PROGRESS
───────────────────────────── */
function updPg() {
  [{pg:'pg1',ln:'ln1',lb:'lb1'},{pg:'pg2',ln:'ln2',lb:'lb2'},{pg:'pg3',ln:'ln3',lb:'lb3'},{pg:'pg4',ln:null,lb:'lb4'}]
  .forEach(({pg,ln,lb},i)=>{
    const n=i+1, el=document.getElementById(pg), lel=document.getElementById(lb);
    const lnel=ln?document.getElementById(ln):null;
    if(n<cur){
      el.style.cssText='background:#006241;border-color:#006241;color:#fff;width:2rem;height:2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;border-width:2px;transition:all .3s';
      el.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
      lel.style.color='#006241'; if(lnel)lnel.style.background='#006241';
    } else if(n===cur){
      el.style.cssText='background:#006241;border-color:#006241;color:#fff;width:2rem;height:2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;border-width:2px;transition:all .3s';
      el.innerHTML=n; lel.style.color='#006241'; if(lnel)lnel.style.background='#EDE0CC';
    } else {
      el.style.cssText='background:#EDE0CC;border-color:#EDE0CC;color:#9CA3AF;width:2rem;height:2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;border-width:2px;transition:all .3s';
      el.innerHTML=n; lel.style.color='#9CA3AF'; if(lnel)lnel.style.background='#EDE0CC';
    }
  });
}
function updHdr(){ document.getElementById('hdr-step').textContent=`STEP ${cur} / 4`; }

/* ── 目的地 検索（Nominatim） ── */
async function doDestSearch() {
  const q = document.getElementById('dest-input').value.trim();
  if (!q) { showDestErr('場所名を入力してください'); return; }

  // Loading
  const btn = document.getElementById('dest-search-btn');
  document.getElementById('dst-btn-txt').style.display = 'none';
  document.getElementById('dst-spin').style.display    = '';
  btn.disabled = true;
  document.getElementById('dest-err').style.display = 'none';

  try {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q + ' 日本')}&format=json&limit=1&countrycodes=jp&accept-language=ja`,
      { headers: { 'User-Agent': 'KaishokuSelect/1.0', 'Accept-Language': 'ja' } }
    );
    const data = await res.json();

    if (!data.length) {
      showDestErr(`「${q}」が見つかりませんでした。別のキーワードを試してください`);
      return;
    }

    S.lat  = parseFloat(data[0].lat);
    S.lng  = parseFloat(data[0].lon);
    // 表示名を短くきれいに（例: "東京タワー" だけ取り出す）
    const rawName = data[0].display_name || '';
    S.area = rawName.split(',')[0].trim();

    // 成功 UI — querySelector の代わりに直接IDや nth-child で確実に取得
    const card  = document.getElementById('dest-card');
    const pList = card.querySelectorAll('p');
    // pList[0] = タイトル行, pList[1] = サブテキスト行
    if (pList[0]) pList[0].textContent = '📍 ' + S.area;
    if (pList[1]) {
      pList[1].textContent = '目的地を設定しました ✓';
      pList[1].style.color = '#CBA258';
    }
    card.style.borderColor = '#CBA258';
    document.getElementById('dest-area').style.display = 'none';
    enableNext();

  } catch(e) {
    showDestErr('検索中にエラーが発生しました。もう一度お試しください');
  } finally {
    document.getElementById('dst-btn-txt').style.display = '';
    document.getElementById('dst-spin').style.display    = 'none';
    btn.disabled = false;
  }
}
function showDestErr(msg) {
  const el = document.getElementById('dest-err');
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
}

/* ── GPS 取得 ── */
async function doGPS() {
  if (!navigator.geolocation) {
    alert('このブラウザは位置情報に対応していません。\n目的地を入力してください。');
    return;
  }
  resetDestCard();
  S.lat = null; S.lng = null;
  gpsIconState('loading');
  document.getElementById('gps-label').textContent = '取得中...';
  document.getElementById('gps-sub').textContent   = 'GPS測位しています';
  document.getElementById('gps-btn').disabled = true;
  disableNext();

  function tryGPS(hi, t) {
    return new Promise((res, rej) =>
      navigator.geolocation.getCurrentPosition(res, rej,
        { enableHighAccuracy: hi, timeout: t, maximumAge: 60000 })
    );
  }
  async function revGeo(lat, lng) {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ja&zoom=16`,
      { headers: { 'User-Agent': 'KaishokuSelect/1.0', 'Accept-Language': 'ja' } }
    );
    const d = await r.json(); const a = d.address || {};
    const skip = new Set(['東京都','東京','大阪府','大阪','神奈川県','愛知県',
                          '福岡県','北海道','京都府','兵庫県','日本','Japan']);
    const ok = v => v && !skip.has(v.trim());
    return (ok(a.neighbourhood)&&a.neighbourhood)||(ok(a.quarter)&&a.quarter)
          ||(ok(a.suburb)&&a.suburb)||(ok(a.borough)&&a.borough)
          ||(ok(a.town)&&a.town)||(ok(a.village)&&a.village)
          ||(ok(a.municipality)&&a.municipality)||(ok(a.county)&&a.county)
          ||(ok(a.city)&&a.city)||(ok(a.city_district)&&a.city_district)||'現在地';
  }

  try {
    let pos;
    try { pos = await tryGPS(true, 8000); }
    catch(e1) {
      if (e1.code === 1) throw e1;
      document.getElementById('gps-label').textContent = '再試行中...';
      document.getElementById('gps-sub').textContent   = '通常精度で取得しています';
      pos = await tryGPS(false, 10000);
    }
    S.lat = pos.coords.latitude; S.lng = pos.coords.longitude;
    let name = '現在地';
    try { name = await revGeo(S.lat, S.lng); } catch(_) {}
    S.area = name;
    gpsIconState('ok');
    document.getElementById('gps-label').textContent = name + '周辺';
    document.getElementById('gps-sub').textContent   = 'GPS取得済み ✓';
    document.getElementById('gps-sub').style.color   = '#CBA258';
    document.getElementById('gps-btn').style.borderColor = '#CBA258';
    enableNext();
  } catch(err) {
    resetGPSBtn();
    const msg = {
      1:'GPSの利用が許可されていません。\nブラウザの🔒→「位置情報」→「許可」\n\nまたは目的地を入力してください。',
      2:'現在地を取得できませんでした。\n目的地を入力してください。',
      3:'GPSがタイムアウトしました。\n目的地を入力してください。',
    };
    alert(msg[err.code] || '位置情報の取得に失敗しました。');
  } finally {
    document.getElementById('gps-btn').disabled = false;
  }
}

function clearArea() {

};

function buildConds(){
  S.conds=[];
  document.getElementById('s3a').textContent=S.area;
  document.getElementById('s3p').textContent=S.purpose;
  const w=document.getElementById('cwrap');
  w.innerHTML='';
  (CMAP[S.purpose]||[]).forEach(c=>{
    const b=document.createElement('button');
    b.className='chip px-4 py-2.5 rounded-full border-2 text-sm font-bold flex items-center gap-2';
    b.style.cssText='background:#fff;border-color:#EDE0CC;color:#1A1A1A';
    b.innerHTML=`<span>${c.i}</span>${c.l}`;
    b.onclick=()=>{
      const idx=S.conds.indexOf(c.l);
      if(idx>=0){S.conds.splice(idx,1);b.style.cssText='background:#fff;border-color:#EDE0CC;color:#1A1A1A';}
      else{S.conds.push(c.l);b.style.cssText='background:#006241;border-color:#006241;color:#fff';}
    };
    w.appendChild(b);
  });
}

  resetAreaChips();

  disableNext();
  go(1);
}
