/* ─────────────────────────────
   SCORING ENGINE
───────────────────────────── */
function scoreStore(s) {
  let sc = 0;
  if (s.areas.includes(S.area))     sc += 12;  // エリア一致
  if (s.purpose.includes(S.purpose)) sc += 10;  // 用途一致
  S.conds.forEach(c => { if (s.tags.includes(c)) sc += 5; });  // 条件一致
  sc += (s._r = s._r || Math.random() * 3);  // ランダム微差
  return sc;
}

function getTop3() {
  return [...DB]
    .map(s => ({...s, sc: scoreStore(s)}))
    .sort((a,b) => b.sc - a.sc)
    .slice(0, 3);
}

/* ─────────────────────────────
   NAVIGATION
───────────────────────────── */
function go(next) {
  if (next===3) buildConds();
  const dir = next > cur ? 'r' : 'l';
  const from= document.getElementById('step'+cur);
  const to  = document.getElementById('step'+next);
  from.classList.add('out-'+dir);
  setTimeout(()=>{
    from.classList.add('hidden'); from.classList.remove('out-r','out-l');
    to.classList.remove('hidden'); to.classList.add('slide-'+dir);
    setTimeout(()=>to.classList.remove('slide-r','slide-l'),320);
    if (next===4) renderTop3();
  },200);
  cur=next; updPg(); updHdr();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updPg() {
  [{pg:'pg1',ln:'ln1',lb:'lb1'},{pg:'pg2',ln:'ln2',lb:'lb2'},{pg:'pg3',ln:'ln3',lb:'lb3'},{pg:'pg4',ln:null,lb:'lb4'}]
  .forEach(({pg,ln,lb},i)=>{
    const n=i+1, el=document.getElementById(pg), lel=document.getElementById(lb);
    const lnel=ln?document.getElementById(ln):null;
    if(n<cur){
      el.style.cssText='background:#006241;border-color:#006241;color:#fff;width:2rem;height:2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;border-width:2px;transition:all .3s';
      el.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
      lel.style.color='#006241'; if(lnel)lnel.style.background='#006241';
    } else if(n===cur){
      el.style.cssText='background:#006241;border-color:#006241;color:#fff;width:2rem;height:2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;border-width:2px;transition:all .3s';
      el.innerHTML=n; lel.style.color='#006241'; if(lnel)lnel.style.background='#EDE0CC';
    } else {
      el.style.cssText='background:#EDE0CC;border-color:#EDE0CC;color:#9CA3AF;width:2rem;height:2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;border-width:2px;transition:all .3s';
      el.innerHTML=n; lel.style.color='#9CA3AF'; if(lnel)lnel.style.background='#EDE0CC';
    }
  });
}

function buildConds(){
  S.conds=[];

  document.getElementById('s3p').textContent=S.purpose;
  const w=document.getElementById('cwrap');
  w.innerHTML='';
  (CMAP[S.purpose]||[]).forEach(c=>{
    const b=document.createElement('button');
    b.className='chip px-4 py-2.5 rounded-full border-2 text-sm font-bold flex items-center gap-2';
    b.style.cssText='background:#fff;border-color:#EDE0CC;color:#1A1A1A';
    b.innerHTML=`<span>${c.i}</span>${c.l}`;
    b.onclick=()=>{
      const idx=S.conds.indexOf(c.l);
      if(idx>=0){S.conds.splice(idx,1);b.style.cssText='background:#fff;border-color:#EDE0CC;color:#1A1A1A';}
      else{S.conds.push(c.l);b.style.cssText='background:#006241;border-color:#006241;color:#fff';}
    };
    w.appendChild(b);
  });
}

   RESTART
───────────────────────────── */
function restart(){
  S.area=''; S.purpose=''; S.conds=[];
  document.querySelectorAll('.ac').forEach(b=>{b.style.background='#fff';b.style.borderColor='#EDE0CC';b.style.color='#1A1A1A';});
  const nb=document.getElementById('s1next');
  nb.disabled=true; nb.style.background='#EDE0CC'; nb.style.color='#bbb';
  nb.style.cursor='not-allowed'; nb.style.boxShadow='none';
  go(1);
}
